version: "2"
linters:
  default: all
  disable:
    - cyclop
    - depguard
    - dupl
    - err113
    - errorlint
    - exhaustruct
    - exptostd
    - forbidigo
    - funlen
    - gocyclo
    - gochecknoglobals
    - gocognit
    - goconst
    - godox
    # deprecated, superseded by gomodguard_v2 (enabled by "default: all")
    - gomodguard
    - lll
    - mnd
    - nestif
    - nlreturn
    - perfsprint
    - prealloc
    - tagliatelle
    - testpackage
    - varnamelen
    - wrapcheck
    - wsl
    - funcorder
    - noinlineerr
    - wsl_v5
  settings:
    errcheck:
      check-type-assertions: false

    gocritic:
      enable-all: true
      disabled-checks:
        - assignOp
        - equalFold
        - hugeParam
        - ifElseChain
        - nestingReduce
        - paramTypeCombine
        - rangeValCopy
        - unnamedResult
        - whyNoLint

    govet:
      disable:
        # reports the inliner's own limitations ("cannot inline: type parameter
        # inference is not yet supported") on calls to slices.Contains
        - inline

    misspell:
      locale: US
    nolintlint:
      require-explanation: false
      require-specific: false
      allow-unused: false

    revive:
      severity: error
      enable-all-rules: true
      rules:
        - name: add-constant
          disabled: true
        - name: cognitive-complexity
          arguments:
            # lower this after refactoring
            - 67
        - name: cyclomatic
          arguments:
            # lower this after refactoring
            - 48
        - name: comment-spacings
          disabled: true
        - name: enforce-switch-style
          disabled: true
        - name: function-length
          arguments:
            # lower this after refactoring
            - 79
            - 153
        - name: function-result-limit
          disabled: true
        - name: increment-decrement
          disabled: true
        - name: get-return
          disabled: true
        - name: identical-switch-branches
          disabled: true
        - name: flag-parameter
          disabled: true
        - name: line-length-limit
          arguments:
            # lower this after refactoring
            - 168
        - name: exported
          disabled: true
        - name: unexported-return
          disabled: true
        - name: unnecessary-format
          disabled: true
        - name: var-naming
          disabled: true
        - name: unused-receiver
          disabled: true
        - name: use-errors-new
          disabled: true
        - name: unhandled-error
          arguments:
            - fmt.Print
            - fmt.Printf
            - fmt.Println

    wsl:
      allow-trailing-comment: true
  exclusions:
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - govet
        text: 'shadow: declaration of "err" shadows declaration'

      # Execute() is only ever called from main()
      - linters:
          - revive
        path: cmd/root.go
        text: 'deep-exit: calls to flag.Parse'
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gci
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/crowdsecurity)
        - prefix(github.com/crowdsecurity/crowdsec)
        - prefix(github.com/crowdsecurity/cs-aws-waf-bouncer)
  exclusions:
    paths:
      - third_party$
      - builtin$
      - examples$
